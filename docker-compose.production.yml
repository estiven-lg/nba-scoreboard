services:
  frontend:
    build:
     context: ./front-end
     dockerfile: Dockerfile
    container_name: frontend
    env_file: .env
    ports:
     - "8585:80"
    depends_on:
     - backend
    networks:
      - nba-vps
    restart: always
      
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: backend
    env_file: .env
    environment:
      CONNECTION_STRING: "Server=db;Database=${MSSQL_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      - db
      - rabbitmq
    networks:
      - nba-vps
    restart: always
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    env_file: .env
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_TCP_PORT=1433

    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - nba-vps
    restart: always
  # report microservice
  reportdb:
    image: couchdb:3.3.1
    container_name: reportdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - reportdb_data:/opt/couchdb/data
    networks:
      - nba-vps
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - nba-vps
    restart: always
  replicator:
    build: ./replicator
    container_name: replicator
    env_file: .env
    depends_on:
      - rabbitmq
      - reportdb
    networks:
      - nba-vps
  reports-api:
    build:
     context: ./reports-api
     dockerfile: Dockerfile
    container_name: reports-api
    env_file: .env
    depends_on:
     - reportdb
    networks:
      - nba-vps
    restart: always

volumes:
  sql_data:
  reportdb_data:

networks:
  nba-vps:
    driver: bridge